name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-ts:
    name: TS lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '!@pod-life/optimizer' typecheck
      - run: pnpm --filter '!@pod-life/optimizer' lint

  test-api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: podlife_test
          POSTGRES_USER: podlife
          POSTGRES_PASSWORD: podlife
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U podlife -d podlife_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://podlife:podlife@localhost:5432/podlife_test
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pod-life/api db:migrate
      - run: pnpm --filter @pod-life/api test

  test-optimizer:
    name: Optimizer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/optimizer/requirements.txt
      - run: |
          cd apps/optimizer
          python -m pip install --upgrade pip
          pip install -r requirements.txt -e ".[dev]"
      - run: cd apps/optimizer && ruff check src tests
      - run: cd apps/optimizer && pytest -q

  test-web:
    name: Web tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pod-life/web test
      - run: pnpm --filter @pod-life/web build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [lint-typecheck-ts, test-optimizer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
      - name: Build optimizer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/optimizer/Dockerfile
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
